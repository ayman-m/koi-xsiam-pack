      description: metadata.notification_event_id. THE ONLY FIELD THAT IDENTIFIES AN ALERT OCCURRENCE.
        Coverage 100%; 317 distinct values across 1,172 rows over 90 days, and a verified 1:1 identity
        for (item.id, device.id, finding_info.uid, finding_info.created_time). The KOI integration re-sends
        every still-open alert once a minute, so the same notification_id arrives many times - 408 times
        for one mcp_server alert. Do NOT substitute finding_uid (3 distinct - it is the POLICY id) or
        koi_event_id (20 distinct - it is the SCAN BATCH id); both were measured and both are far too
        coarse. KOI Ext - Alert Triage keys its duplicate-suppression gate on this value.
      iscommand: false
      brand: ''
      script: SetAndHandleEmpty
      type: regular
    scriptarguments:
      key:
        simple: KoiContext.notification_id
      value:
        complex:
          root: KoiRaw.metadata
          accessor: notification_event_id
          transformers:
