id: KOI - Extract Alert Context
version: -1
fromversion: 6.10.0
name: KOI - Extract Alert Context
description: 'Builds the KoiContext object every KOI triage/investigation playbook consumes.


  Primary path reads the alert''s OCSF payload directly — finding_info, observables, resources and metadata
  — which is what the KOI collector actually writes into koi_koi_raw. Verified on-tenant: all 12,375 Alerts
  rows carry those four blobs.


  Fallback path (legacy) re-parses a koi_context={...} blob out of the alert description. That was the
  only mechanism before v1.5.0 and it depends on a customer-authored correlation rule embedding the blob
  — real alerts on the test tenant did NOT contain it, which left KoiContext empty and degraded every
  verdict to Suspicious. The fallback is kept so existing deployments that do embed it keep working; new
  deployments should rely on the OCSF path.


  marketplace is emitted API-safe (the KOI event vocabulary is not the API vocabulary); marketplace_raw
  keeps the verbatim event value.'
