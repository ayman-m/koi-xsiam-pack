inputs:
- key: finding_info
  value:
    simple: ${alert.finding_info}
  required: false
  description: OCSF finding_info object from the KOI alert.
  playbookInputQuery: null
- key: observables
  value:
    simple: ${alert.observables}
  required: false
  description: OCSF observables array from the KOI alert.
  playbookInputQuery: null
- key: resources
  value:
    simple: ${alert.resources}
  required: false
  description: OCSF resources array from the KOI alert.
  playbookInputQuery: null
- key: metadata
  value:
    simple: ${alert.metadata}
  required: false
  description: OCSF metadata object. Carries notification_event_id — the alert identity.
  playbookInputQuery: null
- key: alert_description
  value:
    simple: ${incident.details}
  required: false
  description: 'LEGACY FALLBACK ONLY. Used when the OCSF payload is unavailable: the playbook re-parses
    a koi_context={...} blob out of this text.'
  playbookInputQuery: null
outputs:
- contextPath: KoiContext
  description: The KOI alert context object, assembled from the alert's own OCSF payload.
  type: unknown
- contextPath: KoiContext.item_id
  description: The flagged item's ID (package / extension / MCP identifier). From observables[name="item.id"].
  type: string
- contextPath: KoiContext.marketplace
  description: 'The item''s marketplace, MAPPED to the vocabulary the KOI API accepts (VERIFIED_FACTS
    7c). This is the value to pass to koi-inventory-item-get, koi-inventory-item-endpoints-list and koi-blocklist-items-add.
    Deliberately EMPTY when the event value has no API equivalent (ollama, built_in, side_loaded), when
    the event carried no marketplace (all 21 mcp_server alerts - and no extension alert has arrived since
    2026-07-09, so this is now the usual outcome), or when KOI introduces a value this map does not know:
    resolve those with koi-inventory-list(item_id=..., limit=1) and read Koi.Inventory.marketplace.'
  type: string
- contextPath: KoiContext.marketplace_raw
  description: The marketplace exactly as the event wrote it, before mapping - e.g. "chrome", "software_windows",
    "built_in". Kept for the record and for correlating back to koi_koi_raw. NEVER pass this to a KOI
    command; it returns HTTP 400 for every value except npm and pypi.
  type: string
- contextPath: KoiContext.item_type
  description: extension | mcp_server. From observables[name="item.type"].
  type: string
- contextPath: KoiContext.item_version
  description: The item version that triggered the alert. From observables[name="item.version"].
  type: string
- contextPath: KoiContext.version
  description: Compatibility alias of KoiContext.item_version, for callers ported from the custom pack.
  type: string
- contextPath: KoiContext.risk_level
  description: KOI's risk level for the item or MCP server at alert time (low/medium/high/critical/pending).
  type: string
- contextPath: KoiContext.package_name
  description: The item or MCP server package name.
  type: string
- contextPath: KoiContext.mcp_id
  description: The MCP server ID. MCP alerts only; empty on extension alerts.
  type: string
- contextPath: KoiContext.device_id
  description: The affected device ID. From resources[type="device"].data.id.
  type: string
- contextPath: KoiContext.alert_hostname
  description: The affected device hostname. From resources[type="device"].data.hostname.
  type: string
- contextPath: KoiContext.device_last_user
  description: Last logged-on user on the affected device.
  type: string
- contextPath: KoiContext.device_os
  description: The affected device OS (linux/mac/windows).
  type: string
- contextPath: KoiContext.device_serial
  description: The affected device serial number.
  type: string
- contextPath: KoiContext.alert_type
  description: 'The OCSF finding type. Constant on live data: "policy_violation".'
  type: string
- contextPath: KoiContext.finding_uid
  description: The finding definition UID (not per-occurrence).
  type: string
- contextPath: KoiContext.finding_title
  description: The finding title - the practical discriminator between alert kinds.
  type: string
- contextPath: KoiContext.koi_event_id
  description: KOI scan-batch UUID. Shared across many alerts from the same scan; not a unique alert id.
  type: string
- contextPath: KoiContext.notification_id
  description: metadata.notification_event_id - the ONLY per-occurrence alert identity in the KOI Alerts
    stream (317 distinct over 1,172 rows / 90 days, 100% populated). The integration re-sends every still-open
    alert once a minute, so many alerts share one notification_id; deduplicate on this and on nothing
    else. finding_uid is the policy id and koi_event_id is the scan-batch id.
  type: string
tags:
- koi
quiet: false
